    <radialGradient id="galaxy-body" cx="30%" cy="30%">
        <stop offset="0%" stop-color="#E6E6FA"/><stop offset="50%" stop-color="#9370DB"/>
        <stop offset="100%" stop-color="#1A0033"/>
